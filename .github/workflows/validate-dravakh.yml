name: Validate Dravakh Map Studio

on:
  push:
    branches: ["dravakh-studio-v1"]
  pull_request:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read

env:
  ELECTRON_SKIP_BINARY_DOWNLOAD: 1

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate and validate Dravakh baseline
        run: |
          npm run generate:dravakh-heightmap
          npm run validate:dravakh-baseline
      - name: TypeScript and production build
        run: npm run build
