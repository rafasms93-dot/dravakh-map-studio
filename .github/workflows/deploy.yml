# Deploy Dravakh Map Studio to GitHub Pages
name: Deploy Dravakh Map Studio to Pages

on:
  push:
    branches: ["dravakh-studio-v1"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  ELECTRON_SKIP_BINARY_DOWNLOAD: 1

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: "./dist"
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
